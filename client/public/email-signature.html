<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Signature - Waterloo Quant Club</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="robots" content="noindex" />
  </head>

  <!--
    ==========================================================================
    WQC EMAIL SIGNATURE

    HOW TO USE
      1. Open https://waterlooquantclub.com/email-signature.html
      2. Select the whole signature below and copy it (Cmd/Ctrl + A, Cmd/Ctrl + C)
      3. Paste into Gmail: Settings -> See all settings -> General ->
         Signature -> Create new, then paste. Save changes at the bottom.
      4. Replace the name, title, and email with your own.

    ==========================================================================
  -->

  <body style="margin: 24px; background: #ffffff">
    <main>
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="background: none; border: 0px; margin: 0px; padding: 0px"
      >
        <tbody>
          <tr>
            <td height="12"></td>
          </tr>
          <tr>
            <td
              style="
                font-family: Helvetica, Arial, sans-serif;
                font-size: 14px;
                font-weight: bold;
                line-height: 20px;
                color: #1a1a1a;
              "
            >
              Firstname Lastname
            </td>
          </tr>
          <tr>
            <td
              style="
                font-family: Helvetica, Arial, sans-serif;
                font-size: 14px;
                font-weight: bold;
                line-height: 20px;
                color: #1a1a1a;
              "
            >
              Title
            </td>
          </tr>
          <tr>
            <td
              style="
                font-family: Helvetica, Arial, sans-serif;
                font-size: 14px;
                line-height: 20px;
                color: #1a1a1a;
              "
            >
              name@waterlooquantclub.com
            </td>
          </tr>
          <tr>
            <td style="padding-top: 8px">
              <table
                cellpadding="0"
                cellspacing="0px"
                border="0"
                style="border: 0"
              >
                <tbody>
                  <tr>
                    <td
                      valign="bottom"
                      style="padding: 0 16px 0 0; line-height: 0; font-size: 0"
                    >
                      <a
                        href="https://www.instagram.com/wlooquantclub/"
                        target="_blank"
                        style="
                          display: block;
                          text-decoration: none;
                          line-height: 0;
                          font-size: 0;
                        "
                        ><img
                          src="https://waterlooquantclub.com/email-signature/instagram.png"
                          alt="Instagram"
                          width="20"
                          height="20"
                          style="
                            width: 20px;
                            height: 20px;
                            border: 0;
                            display: block;
                          "
                      /></a>
                    </td>
                    <td
                      valign="bottom"
                      style="
                        padding: 0 16px 2px 0;
                        line-height: 0;
                        font-size: 0;
                      "
                    >
                      <a
                        href="https://www.linkedin.com/company/waterloo-quant-club"
                        target="_blank"
                        style="
                          display: block;
                          text-decoration: none;
                          line-height: 0;
                          font-size: 0;
                        "
                        ><img
                          src="https://waterlooquantclub.com/email-signature/linkedin.png"
                          alt="LinkedIn"
                          width="20"
                          height="20"
                          style="
                            width: 20px;
                            height: 20px;
                            border: 0;
                            display: block;
                          "
                      /></a>
                    </td>
                    <td
                      valign="bottom"
                      style="padding: 0 16px 0 0; line-height: 0; font-size: 0"
                    >
                      <a
                        href="https://discord.gg/Hu3FxfHnZt"
                        target="_blank"
                        style="
                          display: block;
                          text-decoration: none;
                          line-height: 0;
                          font-size: 0;
                        "
                        ><img
                          src="https://waterlooquantclub.com/email-signature/discord.png"
                          alt="Discord"
                          width="20"
                          height="20"
                          style="
                            width: 20px;
                            height: 20px;
                            border: 0;
                            display: block;
                          "
                      /></a>
                    </td>
                    <td
                      valign="bottom"
                      style="padding: 0 0 1px 0; line-height: 0; font-size: 0"
                    >
                      <a
                        href="mailto:info@waterlooquantclub.com"
                        style="
                          display: block;
                          text-decoration: none;
                          line-height: 0;
                          font-size: 0;
                        "
                        ><img
                          src="https://waterlooquantclub.com/email-signature/email.png"
                          alt="Email"
                          width="18"
                          height="18"
                          style="
                            width: 18px;
                            height: 18px;
                            border: 0;
                            display: block;
                          "
                      /></a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top: 16px">
              <!-- Logo lockup: image mark + HTML wordmark, per the brand lockup -->
              <table
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="border: 0"
              >
                <tbody>
                  <tr>
                    <td valign="middle" style="padding: 0">
                      <a
                        href="https://waterlooquantclub.com/"
                        target="_blank"
                        style="text-decoration: none"
                        ><img
                          src="https://waterlooquantclub.com/logo.svg"
                          alt="Waterloo Quant Club"
                          width="48"
                          height="48"
                          style="
                            width: 48px;
                            height: 48px;
                            border: 0;
                            display: block;
                          "
                      /></a>
                    </td>
                    <td valign="middle" style="padding: 0 0 0 11px">
                      <a
                        href="https://waterlooquantclub.com/"
                        target="_blank"
                        style="
                          text-decoration: none;
                          font-family:
                            Merriweather, Georgia, &quot;Times New Roman&quot;,
                            serif;
                          font-size: 24px;
                          line-height: 22px;
                          font-weight: 500;
                          letter-spacing: 0.2px;
                          color: #1a1a1a;
                          white-space: nowrap;
                        "
                        >Waterloo<br />Quant Club</a
                      >
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
